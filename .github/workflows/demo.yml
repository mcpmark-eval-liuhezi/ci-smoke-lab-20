name: Demo Build

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Write artifact file
        run: |
          echo "CI smoke test artifact" > demo-build.txt
          echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> demo-build.txt
          echo "Repo: ci-smoke-lab-20" >> demo-build.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: demo-build.txt
